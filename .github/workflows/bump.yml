name: Bump and Release
on:
  push:
    branches: ['*-v[0-9]*']

concurrency:
  group: "${{ github.ref }}-${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.commit.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: calculate next version
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: "${{ github.ref_name }}-v"
          dry_run: true
      - name: use commits as changelog
        id: changelog
        if: steps.tag_version.outputs.new_version != ''
        run: |
          PREV="${{ steps.tag_version.outputs.previous_tag }}"
          if [ -n "$PREV" ] && [ "$PREV" != "v0.0.0" ]; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "changelog<<CHANGELOG_EOF"
            git log "$RANGE" --no-merges --pretty=format:'%s'
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: update version, commit and tag
        id: commit
        if: steps.tag_version.outputs.new_version != ''
        run: |
          VERSION="${{ steps.tag_version.outputs.new_version }}"
          TAG="${{ github.ref_name }}-v${VERSION}"

          sed -i "s/^mod_version=.*/mod_version=${VERSION}/" gradle.properties

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "release: ${TAG} [skip ci]"
          git tag "$TAG"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  autorelease:
    needs: bump
    if: needs.bump.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.AUTORELEASE_TOKEN }}
          tag_name: ${{ needs.bump.outputs.tag }}
          body: ${{ needs.bump.outputs.changelog }}