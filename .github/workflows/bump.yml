name: Bump and Release
on:
  push:
    branches: ['*-v[0-9]*']

concurrency:
  group: "${{ github.ref }}-${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: bump version and release
        env:
          GH_TOKEN: ${{ secrets.AUTORELEASE_TOKEN }}
        run: |
          MC_VERSION=$(grep -m1 '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          CURRENT=$(grep -m1 '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')

          PREV_TAG=$(git describe --tags --abbrev=0 --match "*+${MC_VERSION}" 2>/dev/null || echo "")
          BASE=${PREV_TAG%%+*}
          [ -z "$BASE" ] && BASE=$CURRENT
          RANGE=${PREV_TAG:+$PREV_TAG..HEAD}
          COMMITS=$(git log ${RANGE:-HEAD} --no-merges --pretty=%s)

          echo "$COMMITS" | grep -qE '^(feat|fix)(\(.+\))?:' || { echo "Nothing to release."; exit 0; }

          BUMP=patch
          echo "$COMMITS" | grep -qE '^feat(\(.+\))?:' && BUMP=minor
          echo "$COMMITS" | grep -qE '^[a-zA-Z]+(\(.+\))?!:|BREAKING CHANGE:' && BUMP=major

          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          TAG="${NEW}+${MC_VERSION}"
          TITLE="${MC_VERSION}+${NEW}"

          sed -i "s/^mod_version=.*/mod_version=${NEW}/" gradle.properties

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "release: ${TAG} [skip ci]"
          git tag "$TAG"
          git push origin "HEAD:${{ github.ref_name }}" "$TAG"

          gh release create "$TAG" --title "$TITLE" --notes "$(echo "$COMMITS" | sed 's/^/- /')"